name: Build GuardianLink
on: { workflow_dispatch: {}, push: { branches: [main] } }
env:
  SERVER_URL: https://deepskyblue-ibex-929403.hostingersite.com
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: server
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: ./gradlew testDebugUnitTest assembleDebug -PSERVER_URL=${{ env.SERVER_URL }}
        working-directory: android
      - name: Checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GuardianLink.apk
          sha256sum GuardianLink.apk | tee GuardianLink.apk.sha256
          unzip -l GuardianLink.apk | tail -1
      - uses: actions/upload-artifact@v4
        with: { name: GuardianLink-apk, path: "GuardianLink.apk\nGuardianLink.apk.sha256" }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Publish app
        working-directory: windows
        shell: pwsh
        run: |
          "${{ env.SERVER_URL }}" | Set-Content GuardianLink/server.txt
          dotnet publish GuardianLink -c Release -r win-x64 --self-contained -o publish
      - name: Build installer
        working-directory: windows
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Copy-Item Output\GuardianLink-Setup.exe ..\GuardianLink-Setup.exe
          (Get-FileHash ..\GuardianLink-Setup.exe -Algorithm SHA256).Hash | Set-Content ..\GuardianLink-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with: { name: GuardianLink-exe, path: "GuardianLink-Setup.exe\nGuardianLink-Setup.exe.sha256" }
